<section id="contact">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <h1 class="title text-center">Contact us</h1>
        <p class="subtitle text-center">
          Tell us about your volume and goals. Our team will get back to you shortly.
        </p>

        <form class="form" [formGroup]="form" (ngSubmit)="submit()">
          <div class="mb-3">
            <label class="form-label" for="name">Name</label>
            <input id="name" class="form-control" formControlName="name" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="email">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="company">Company</label>
            <input id="company" class="form-control" formControlName="company" />
          </div>
          <div class="mb-3">
            <label class="form-label" for="volume">Volume</label>
            <input id="volume" class="form-control" formControlName="volume" />
          </div>
          <div class="mb-4">
            <label class="form-label" for="message">Message</label>
            <textarea id="message" rows="4" class="form-control" formControlName="message"></textarea>
          </div>

          <div class="consents">
            <label class="consent-row" [class.invalid]="form.controls.ageConfirm.touched && form.controls.ageConfirm.invalid">
              <input class="consent-toggle" type="checkbox" formControlName="ageConfirm" />
              <span class="consent-text">
                I certify that I am 18 years of age or older. Evoramail is an informational
                service and is not directed at minors.
              </span>
            </label>

            <label class="consent-row" [class.invalid]="form.controls.acceptTerms.touched && form.controls.acceptTerms.invalid">
              <input class="consent-toggle" type="checkbox" formControlName="acceptTerms" />
              <span class="consent-text">
                I accept the
                <a routerLink="/terminos-y-condiciones" target="_blank" rel="noopener">terms of use</a>
                and the
                <a routerLink="/politica-de-privacidad" target="_blank" rel="noopener">privacy policy</a>.
              </span>
            </label>

            <label class="consent-row">
              <input class="consent-toggle" type="checkbox" formControlName="marketingOptIn" />
              <span class="consent-text">
                I want to receive notices and updates by email (optional).
              </span>
            </label>
          </div>

          @if ((form.controls.ageConfirm.touched && form.controls.ageConfirm.invalid) || (form.controls.acceptTerms.touched && form.controls.acceptTerms.invalid)) {
            <p class="consent-error">Please accept the required consents to continue.</p>
          }

          <div class="text-center">
            <button type="submit" class="btn-evora">Send request</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
