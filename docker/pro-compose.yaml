services:
  evoramail:
    image: evoramail:latest
    container_name: evoramail
    restart: always
    logging:
      driver: "awslogs"
      options:
        awslogs-region: "eu-west-1"
        awslogs-group: "acens/pro01/evoramail"
        awslogs-create-group: "true"
    deploy:
      resources:
        limits:
          memory: 192M
        reservations:
          cpus: '0.10'
          memory: 128M
    networks:
      - pro01

networks:
  pro01:
    name: pro01
    driver: bridge