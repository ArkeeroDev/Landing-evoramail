name: Deployment

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      REGISTRY: arkeerodev
      REPOSITORY: evoramail
      COMPOSE_FILE: pro-compose.yaml
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Push tag
        id: tag-version
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release_branches: main
          tag_prefix: "v"

      - name: Install SSH key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_KEY }}
          name: id_ed25519
          known_hosts: ${{ secrets.KNOWN_HOSTS }}
          if_key_exists: replace

      - name: Build and copy docker image to server
        id: build-image
        env:
          IMAGE_TAG: ${{ steps.tag-version.outputs.new_tag }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker save $REGISTRY/$REPOSITORY:$IMAGE_TAG | bzip2 \
            | ssh -p ${{ secrets.PRO_PORT }} ${{ secrets.PRO_USERNAME }}@${{ secrets.PRO_HOST }} docker load
          echo "image=$REGISTRY/$REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Fill in the new image ID in the compose file
        run: |
          sed -i "s|image: evoramail:latest|image: ${{ steps.build-image.outputs.image }}|" docker/$COMPOSE_FILE

      - name: Copy compose to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRO_HOST }}
          port: ${{ secrets.PRO_PORT }}
          username: ${{ secrets.PRO_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "docker/pro-compose.yaml"
          target: /home/${{ secrets.PRO_USERNAME }}/docker/evoramail/
          overwrite: true
          strip_components: 1

      - name: Deploy compose file in remote server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRO_HOST }}
          port: ${{ secrets.PRO_PORT }}
          username: ${{ secrets.PRO_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker compose -f /home/${{ secrets.PRO_USERNAME }}/docker/evoramail/pro-compose.yaml up -d
            docker image prune -a -f

      - name: Create a GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag-version.outputs.new_tag }}
          generateReleaseNotes: true